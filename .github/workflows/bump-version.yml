name: Bump Version

# This repository is retired/superseded (see README.md) -- Smart Bridge
# development moved into the main ClashControl repo in v0.3.0. The
# automatic pull_request trigger below is disabled on purpose so this repo
# can never publish another version bump; the workflow file is kept (not
# deleted) so its history stays intact. workflow_dispatch is the standard
# no-op placeholder for "this workflow never fires on its own" -- the job's
# own `if: github.event.pull_request.merged == true` guard also means a
# manual dispatch wouldn't actually run the bump step either.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version to v$VERSION"
          git push origin main
